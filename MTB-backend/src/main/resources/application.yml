server:
  port: 8080
spring:
  application:
    name: MTB-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mytaskboarddb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
